upstream web {
    server web:8000;
}

server {
    listen 80;

    # Compress text responses (#70): static files and the pages Django sends through here. aladin.js
    # goes from 2.39 MB to 0.84 MB on a first visit; Bokeh, jQuery and the CSS shrink similarly.
    # text/html is always compressed once gzip is on. Django masks CSRF tokens per request, which
    # covers the BREACH concern for compressed HTML.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/plain text/javascript application/javascript application/json application/xml image/svg+xml;

    location / {
        proxy_pass http://web/;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /static/ {
        alias /static/;
    }
}